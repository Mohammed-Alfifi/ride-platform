# Local development services: PostgreSQL + PostGIS and Redis.
# Usage: docker compose -f infra/docker-compose.yml up -d
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ride
      POSTGRES_PASSWORD: ride
      POSTGRES_DB: ride
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ride']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  api:
    profiles: ['full']
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: ../apps/api/.env
    environment:
      DATABASE_URL: postgres://ride:ride@db:5432/ride
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db_data:
