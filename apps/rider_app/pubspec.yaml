name: rider_app
description: Rider app - subscribe to scheduled rides and track your driver.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  intl: any
  latlong2: ^0.9.1
  mobile_core:
    path: ../../packages/mobile_core
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
