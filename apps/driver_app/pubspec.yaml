name: driver_app
description: Driver app - join a licensed partner and run your daily routes.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  go_router: ^14.6.2
  dio: ^5.7.0
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  geolocator: ^13.0.2
  intl: any
  url_launcher: ^6.3.1
  mobile_core:
    path: ../../packages/mobile_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
