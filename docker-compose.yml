# Runs the whole platform on your own computer with Docker Desktop.
#   Start:  docker compose up -d --build      (or double-click start.bat on Windows)
#   Stop:   docker compose down               (your data is kept)
#   Wipe:   docker compose down -v            (deletes all local data)
# Dashboard: http://localhost:3001   API: http://localhost:3000   API docs: http://localhost:3000/docs
# Sign in with 0500000000 (platform admin) or 0500000001 (demo partner admin); the code is 123456.
name: ride-local

x-api-env: &api-env
  NODE_ENV: development
  PORT: '3000'
  LOG_LEVEL: info
  CORS_ORIGINS: http://localhost:3001
  SWAGGER_ENABLED: 'true'
  DATABASE_URL: postgres://ride:ride@db:5432/ride
  REDIS_URL: redis://redis:6379
  # Local-only secrets. The server setup generates real ones.
  JWT_ACCESS_SECRET: local-only-jwt-secret-not-for-servers-0123456789
  HASH_PEPPER: local-only-pepper-not-for-servers-0123456789
  DATA_ENCRYPTION_KEY: bG9jYWwtb25seS1rZXktbm90LWZvci1zZXJ2ZXJzISE=
  SMS_PROVIDER: console
  OTP_TEST_PHONES: '+966500000000,+966500000001,+966500000002,+966500000003,+966500000004'
  OTP_TEST_CODE: '123456'
  STORAGE_DRIVER: local
  STORAGE_DIR: /app/var/uploads
  JOBS_ENABLED: 'true'
  PUBLIC_API_URL: http://localhost:3000
  PUBLIC_WEB_URL: http://localhost:3001
  PAYMENT_PROVIDER: sandbox

services:
  db:
    build:
      context: infra/server
      dockerfile: postgres.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ride
      POSTGRES_PASSWORD: ride
      POSTGRES_DB: ride
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ride']
      interval: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment: *api-env
    ports:
      - '3000:3000'
    volumes:
      - uploads:/app/var/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-off: creates the platform admin and a demo partner with a zone and plans. Safe to re-run.
  setup:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *api-env
      SUPER_ADMIN_PHONE: '+966500000000'
      SUPER_ADMIN_NAME: مدير المنصة
    command: ['node', 'dist/database/seed.js', '--demo']
    restart: 'no'
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    environment:
      API_URL: http://api:3000
      COOKIE_SECURE: 'false'
    ports:
      - '3001:3001'
    depends_on:
      - api

volumes:
  db_data:
  redis_data:
  uploads:
