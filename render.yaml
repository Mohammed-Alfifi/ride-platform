# Free hosted demo on Render (render.com), created from this file as a Blueprint:
#   Dashboard -> New -> Blueprint -> pick this repository.
# Everything here is on Render's free plan:
#   - The API and the dashboard sleep after 15 minutes without visits; the first visit then takes about a minute.
#   - The free database is deleted 30 days after creation unless upgraded. For a long pilot use your own server (docs/deploy.md).
# Addresses (Render derives them from the service names):
#   dashboard and public pages  https://mishwar-ride-admin.onrender.com   (/join, /download)
#   rider web app (iPhone)      https://mishwar-ride-app.onrender.com
#   API                         https://mishwar-ride-api.onrender.com
services:
  - type: web
    name: mishwar-ride-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mishwar-ride-db
          property: connectionString
      - key: DATABASE_POOL_MAX
        value: '5'
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mishwar-ride-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: HASH_PEPPER
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: PUBLIC_API_URL
        value: https://mishwar-ride-api.onrender.com
      - key: PUBLIC_WEB_URL
        value: https://mishwar-ride-admin.onrender.com
      - key: RIDER_WEB_URL
        value: https://mishwar-ride-app.onrender.com/
      - key: CORS_ORIGINS
        value: https://mishwar-ride-admin.onrender.com,https://mishwar-ride-app.onrender.com
      # Invite-only pilot without SMS or a payment gateway.
      - key: ACCESS_MODE
        value: invite
      - key: SMS_PROVIDER
        value: none
      - key: PAYMENT_PROVIDER
        value: manual
      - key: REFRESH_TOKEN_TTL_DAYS
        value: '90'
      - key: PILOT_MAX_ACTIVE_SUBSCRIPTIONS
        value: '30'
      # The first platform admin: your phone (+9665XXXXXXXX) signs in to the dashboard with the 6-digit code you choose.
      - key: SUPER_ADMIN_PHONE
        sync: false
      - key: SUPER_ADMIN_NAME
        value: مدير المنصة
      - key: OTP_TEST_PHONES
        sync: false
      - key: OTP_TEST_CODE
        sync: false
      # Creates the admin above plus a demo partner, zone and plans on first start (safe to leave on).
      - key: SEED_DEMO
        value: 'true'
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_DIR
        value: /app/var/uploads
      - key: JOBS_ENABLED
        value: 'true'
      - key: SWAGGER_ENABLED
        value: 'false'
      - key: SUPPORT_WHATSAPP
        sync: false
      - key: FCM_SERVICE_ACCOUNT
        sync: false

  - type: web
    name: mishwar-ride-admin
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/admin/Dockerfile
    dockerContext: .
    envVars:
      - key: API_URL
        value: https://mishwar-ride-api.onrender.com
      - key: COOKIE_SECURE
        value: 'true'
      - key: RIDER_WEB_URL
        value: https://mishwar-ride-app.onrender.com/
      - key: SUPPORT_WHATSAPP
        sync: false
      - key: OPERATOR_NAME
        sync: false

  # The rider app for iPhone and browsers. Built by GitHub Actions ("Web demo build") into the web-build branch.
  - type: web
    name: mishwar-ride-app
    runtime: static
    branch: web-build
    buildCommand: echo "prebuilt by GitHub Actions"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache

  - type: keyvalue
    name: mishwar-ride-redis
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: mishwar-ride-db
    plan: free
    region: frankfurt
    databaseName: ride
    user: ride
