name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API - lint, typecheck, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ride
          POSTGRES_PASSWORD: ride
          POSTGRES_DB: ride_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ride" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ride:ride@localhost:5432/ride_test
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ride/api lint
      - run: pnpm --filter @ride/api typecheck
      - run: pnpm --filter @ride/api test:cov
      - run: pnpm --filter @ride/api build

  performance:
    name: API - performance under load
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ride
          POSTGRES_PASSWORD: ride
          POSTGRES_DB: ride_perf
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ride" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: development
      DATABASE_URL: postgres://ride:ride@localhost:5432/ride_perf
      REDIS_URL: redis://localhost:6379/2
      JWT_ACCESS_SECRET: perf-access-secret-that-is-long-enough-1234567890
      HASH_PEPPER: perf-pepper-1234567890
      DATA_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      OTP_TEST_PHONES: +966500000001,+966500002001
      OTP_TEST_CODE: '123456'
      SUPER_ADMIN_PHONE: +966500000000
      JOBS_ENABLED: 'false'
      LOG_LEVEL: warn
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Database with 1,500 subscribers and two months of trips
        run: |
          sudo apt-get install -y postgresql-client >/dev/null
          node dist/database/migrate.js
          node dist/database/seed.js --demo
          psql "$DATABASE_URL" -q -f perf/seed.sql
      - name: Start the API
        run: |
          nohup node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:3000/health/live && break; sleep 1; done
      - name: Measure (fails when an endpoint is slower than its budget)
        run: |
          token() {
            curl -fs -XPOST localhost:3000/v1/auth/otp/request -H 'content-type: application/json' -d "{\"phone\":\"$1\",\"app\":\"$2\"}" > /dev/null
            curl -fs -XPOST localhost:3000/v1/auth/otp/verify -H 'content-type: application/json' -d "{\"phone\":\"$1\",\"app\":\"$2\",\"code\":\"123456\"}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).accessToken))'
          }
          node perf/run.mjs "$(token 0500000001 admin)" "$(token 0500002001 driver)"
      - name: API log
        if: failure()
        run: tail -50 api.log

  admin:
    name: Admin dashboard - typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ride/admin lint
      - run: pnpm --filter @ride/admin test
      - run: pnpm --filter @ride/admin build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  mobile:
    name: Mobile - analyze and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [packages/mobile_core, apps/rider_app, apps/driver_app]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Problems are also posted as annotations, so they show on the commit page.
      - name: flutter analyze
        id: analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          grep -E '^ *(error|warning) •' analyze.txt > problems.txt
          echo "count=$(wc -l < problems.txt)" >> "$GITHUB_OUTPUT"
          exit 0
      - name: analyzer problems (batch 1)
        if: steps.analyze.outputs.count > 0
        shell: bash
        run: |
          sed -n '1,10p' problems.txt | while IFS= read -r line; do
            msg=$(echo "$line" | awk -F' • ' '{print $2}')
            loc=$(echo "$line" | awk -F' • ' '{print $3}')
            rule=$(echo "$line" | awk -F' • ' '{print $4}')
            echo "::error file=${{ matrix.package }}/${loc%%:*},line=$(echo "$loc" | cut -d: -f2)::$msg ($rule)"
          done
      - name: analyzer problems (batch 2)
        if: steps.analyze.outputs.count > 10
        shell: bash
        run: |
          sed -n '11,20p' problems.txt | while IFS= read -r line; do
            msg=$(echo "$line" | awk -F' • ' '{print $2}')
            loc=$(echo "$line" | awk -F' • ' '{print $3}')
            rule=$(echo "$line" | awk -F' • ' '{print $4}')
            echo "::error file=${{ matrix.package }}/${loc%%:*},line=$(echo "$loc" | cut -d: -f2)::$msg ($rule)"
          done
      - name: analyzer problems (batch 3)
        if: steps.analyze.outputs.count > 20
        shell: bash
        run: |
          sed -n '21,30p' problems.txt | while IFS= read -r line; do
            msg=$(echo "$line" | awk -F' • ' '{print $2}')
            loc=$(echo "$line" | awk -F' • ' '{print $3}')
            rule=$(echo "$line" | awk -F' • ' '{print $4}')
            echo "::error file=${{ matrix.package }}/${loc%%:*},line=$(echo "$loc" | cut -d: -f2)::$msg ($rule)"
          done
      - name: analyzer problems (batch 4)
        if: steps.analyze.outputs.count > 30
        shell: bash
        run: |
          sed -n '31,40p' problems.txt | while IFS= read -r line; do
            msg=$(echo "$line" | awk -F' • ' '{print $2}')
            loc=$(echo "$line" | awk -F' • ' '{print $3}')
            rule=$(echo "$line" | awk -F' • ' '{print $4}')
            echo "::error file=${{ matrix.package }}/${loc%%:*},line=$(echo "$loc" | cut -d: -f2)::$msg ($rule)"
          done
      - name: analyzer problems (batch 5)
        if: steps.analyze.outputs.count > 40
        shell: bash
        run: |
          sed -n '41,50p' problems.txt | while IFS= read -r line; do
            msg=$(echo "$line" | awk -F' • ' '{print $2}')
            loc=$(echo "$line" | awk -F' • ' '{print $3}')
            rule=$(echo "$line" | awk -F' • ' '{print $4}')
            echo "::error file=${{ matrix.package }}/${loc%%:*},line=$(echo "$loc" | cut -d: -f2)::$msg ($rule)"
          done
      - name: flutter test
        if: always()
        shell: bash
        run: |
          set +e
          flutter test > test.txt 2>&1
          code=$?
          cat test.txt
          if [ $code -ne 0 ]; then
            grep -E 'Error:|Expected:|Actual:|EXCEPTION|\[E\]|Some tests failed' test.txt | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $code
      # The rider app also runs in browsers (iPhone users open it from the server at /app/).
      - name: web build (rider app)
        if: always() && matrix.package == 'apps/rider_app'
        shell: bash
        run: |
          flutter create --platforms=web --org sa.ride --project-name rider_app . > /dev/null
          set +e
          flutter build web --release --base-href /app/ > web.txt 2>&1
          code=$?
          tail -30 web.txt
          if [ $code -ne 0 ]; then
            grep -E 'Error|error:' web.txt | head -15 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $code
      - name: fail on analyzer problems
        if: always() && steps.analyze.outputs.count > 0
        run: exit 1
