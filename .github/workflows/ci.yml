name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API - lint, typecheck, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ride
          POSTGRES_PASSWORD: ride
          POSTGRES_DB: ride_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ride" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ride:ride@localhost:5432/ride_test
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ride/api lint
      - run: pnpm --filter @ride/api typecheck
      - run: pnpm --filter @ride/api test:cov
      - run: pnpm --filter @ride/api build

  admin:
    name: Admin dashboard - typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ride/admin lint
      - run: pnpm --filter @ride/admin test
      - run: pnpm --filter @ride/admin build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  mobile:
    name: Mobile - analyze and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [packages/mobile_core, apps/rider_app, apps/driver_app]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Problems are also posted as annotations, so they show on the commit page.
      - name: flutter analyze
        id: analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          grep -E '^ *(error|warning) •' analyze.txt > problems.txt
          echo "count=$(wc -l < problems.txt)" >> "$GITHUB_OUTPUT"
          exit 0
      - name: analyzer problems (batch 1)
        if: steps.analyze.outputs.count > 0
        shell: bash
        run: |
          sed -n '1,10p' problems.txt | while IFS= read -r line; do
            msg=$(echo "$line" | awk -F' • ' '{print $2}')
            loc=$(echo "$line" | awk -F' • ' '{print $3}')
            rule=$(echo "$line" | awk -F' • ' '{print $4}')
            echo "::error file=${{ matrix.package }}/${loc%%:*},line=$(echo "$loc" | cut -d: -f2)::$msg ($rule)"
          done
      - name: analyzer problems (batch 2)
        if: steps.analyze.outputs.count > 10
        shell: bash
        run: |
          sed -n '11,20p' problems.txt | while IFS= read -r line; do
            msg=$(echo "$line" | awk -F' • ' '{print $2}')
            loc=$(echo "$line" | awk -F' • ' '{print $3}')
            rule=$(echo "$line" | awk -F' • ' '{print $4}')
            echo "::error file=${{ matrix.package }}/${loc%%:*},line=$(echo "$loc" | cut -d: -f2)::$msg ($rule)"
          done
      - name: analyzer problems (batch 3)
        if: steps.analyze.outputs.count > 20
        shell: bash
        run: |
          sed -n '21,30p' problems.txt | while IFS= read -r line; do
            msg=$(echo "$line" | awk -F' • ' '{print $2}')
            loc=$(echo "$line" | awk -F' • ' '{print $3}')
            rule=$(echo "$line" | awk -F' • ' '{print $4}')
            echo "::error file=${{ matrix.package }}/${loc%%:*},line=$(echo "$loc" | cut -d: -f2)::$msg ($rule)"
          done
      - name: analyzer problems (batch 4)
        if: steps.analyze.outputs.count > 30
        shell: bash
        run: |
          sed -n '31,40p' problems.txt | while IFS= read -r line; do
            msg=$(echo "$line" | awk -F' • ' '{print $2}')
            loc=$(echo "$line" | awk -F' • ' '{print $3}')
            rule=$(echo "$line" | awk -F' • ' '{print $4}')
            echo "::error file=${{ matrix.package }}/${loc%%:*},line=$(echo "$loc" | cut -d: -f2)::$msg ($rule)"
          done
      - name: analyzer problems (batch 5)
        if: steps.analyze.outputs.count > 40
        shell: bash
        run: |
          sed -n '41,50p' problems.txt | while IFS= read -r line; do
            msg=$(echo "$line" | awk -F' • ' '{print $2}')
            loc=$(echo "$line" | awk -F' • ' '{print $3}')
            rule=$(echo "$line" | awk -F' • ' '{print $4}')
            echo "::error file=${{ matrix.package }}/${loc%%:*},line=$(echo "$loc" | cut -d: -f2)::$msg ($rule)"
          done
      - name: flutter test
        if: always()
        shell: bash
        run: |
          set +e
          flutter test > test.txt 2>&1
          code=$?
          cat test.txt
          if [ $code -ne 0 ]; then
            grep -E 'Error:|Expected:|Actual:|EXCEPTION|\[E\]|Some tests failed' test.txt | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $code
      - name: fail on analyzer problems
        if: always() && steps.analyze.outputs.count > 0
        run: exit 1
