# Builds what pilot users install, and publishes it as a GitHub release:
#   mishwar-rider.apk, mishwar-driver.apk  (Android, signed with the project's key)
#   mishwar-rider-web.zip                   (rider app for iPhone and browsers; the server serves it at /app/)
# The download page (/download) always links the latest release.
#
# Run it from GitHub: Actions -> "Release builds" -> Run workflow, and enter the API address.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
#     The signing key. Keep the same key forever: Android installs an update only when it is
#     signed with the same key as the installed app.
#   FIREBASE_API_KEY, FIREBASE_PROJECT_ID, FIREBASE_SENDER_ID, FIREBASE_APP_ID_RIDER, FIREBASE_APP_ID_DRIVER
#     Optional, for push notifications (free Firebase plan). Without them the apps use the in-app inbox.
name: Release builds

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'API address the apps talk to (e.g. https://ride-api.duckdns.org)'
        required: true
      publish:
        description: 'Publish as the latest release (untick to only test the builds)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [rider_app, driver_app]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The repository keeps only Dart code; generate the Android project around it.
      - run: flutter create --platforms=android --org sa.ride --project-name ${{ matrix.app }} .
      - name: Permissions and app name
        run: |
          manifest=android/app/src/main/AndroidManifest.xml
          perms='<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'
          if [ "${{ matrix.app }}" = "driver_app" ]; then
            perms="$perms"'<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>'
          fi
          sed -i "s|<application|$perms\n    <application|" "$manifest"
          if [ "${{ matrix.app }}" = "driver_app" ]; then label='مشوار للسائقين'; else label='مشوار'; fi
          sed -i "s|android:label=\"[^\"]*\"|android:label=\"$label\"|" "$manifest"
      - run: flutter pub get
      - name: Build
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_APP_ID: ${{ matrix.app == 'rider_app' && secrets.FIREBASE_APP_ID_RIDER || secrets.FIREBASE_APP_ID_DRIVER }}
        run: |
          flutter build apk --release \
            --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} \
            --dart-define=API_URL=${{ inputs.api_url }} \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID"
      - name: Sign with the project key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          name=$([ "${{ matrix.app }}" = "rider_app" ] && echo mishwar-rider || echo mishwar-driver)
          mkdir -p ../../out
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing key in the repository secrets. This APK carries a temporary key: testers must uninstall it before installing a later build."
            cp build/app/outputs/flutter-apk/app-release.apk "../../out/$name.apk"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "${KEY_ALIAS:-mishwar}" --out "../../out/$name.apk" build/app/outputs/flutter-apk/app-release.apk
          "$apksigner" verify --print-certs "../../out/$name.apk" | head -3
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app }}
          path: out/*.apk
          retention-days: 30

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rider_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=web --org sa.ride --project-name rider_app .
      - name: App name, colours and Arabic
        run: |
          sed -i 's|"name": "[^"]*"|"name": "مشوار"|; s|"short_name": "[^"]*"|"short_name": "مشوار"|; s|"background_color": "[^"]*"|"background_color": "#18263A"|; s|"theme_color": "[^"]*"|"theme_color": "#18263A"|' web/manifest.json
          sed -i 's|<title>[^<]*</title>|<title>مشوار</title>|; s|<html>|<html lang="ar" dir="rtl">|; s|content="rider_app"|content="مشوار"|g' web/index.html
          sed -i 's|<meta name="description" content="[^"]*">|<meta name="description" content="مشوار: توصيل يومي باشتراك شهري">|' web/index.html
      - run: flutter pub get
      - run: flutter build web --release --base-href /app/ --dart-define=API_URL=${{ inputs.api_url }}
      - name: Package
        run: |
          mkdir -p ../../out
          cd build/web && zip -qr ../../../../out/mishwar-rider-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: out/mishwar-rider-web.zip
          retention-days: 30

  publish:
    needs: [android, web]
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          tag="pilot-${{ github.run_number }}"
          gh release create "$tag" out/* --repo "${{ github.repository }}" --latest \
            --title "مشوار - نسخة التجربة ${{ github.run_number }}" \
            --notes "API: ${{ inputs.api_url }}
          - mishwar-rider.apk: تطبيق الراكب (أندرويد)
          - mishwar-driver.apk: تطبيق السائق (أندرويد)
          - mishwar-rider-web.zip: نسخة الويب للآيفون (ينزلها الخادم تلقائيا عند bash update.sh)"
