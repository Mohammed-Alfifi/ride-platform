# Keeps the free Render API awake during operating hours, so riders and drivers never wait a minute
# for it to wake up. Render's free plan sleeps a service after 15 minutes without traffic and gives
# 750 free hours a month for all services together: pinging only from 05:00 to 22:00 Riyadh time
# (about 530 hours a month) leaves room for the dashboard and stays inside the allowance.
# If a ping fails the run fails, and GitHub emails the repository owner: a free uptime alert.
#
# Change the addresses without editing this file: Settings -> Secrets and variables -> Actions ->
# Variables -> KEEPALIVE_URLS (space separated).
name: Keep alive

on:
  schedule:
    # Every 10 minutes, 02:00-18:59 UTC = 05:00-21:59 Riyadh (UTC+3).
    - cron: '*/10 2-18 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping
        env:
          URLS: ${{ vars.KEEPALIVE_URLS || 'https://mishwar-ride-api.onrender.com/health/live' }}
        run: |
          failed=0
          for url in $URLS; do
            # A sleeping service takes up to a minute to start; allow two minutes.
            if out=$(curl -fsS --max-time 120 --retry 2 --retry-delay 10 -o /dev/null -w '%{http_code} in %{time_total}s' "$url"); then
              echo "OK   $url  $out"
            else
              echo "::error::Not responding: $url"
              failed=1
            fi
          done
          exit $failed
